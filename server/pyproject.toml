[project]
name = "server"
version = "0.1.0"
description = "FastAPI + yt-dlp video resolver backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.4",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
    "yt-dlp>=2024.1.1",
    "httpx>=0.26.0",
    "redis>=5.0.0",
    "prometheus-client>=0.19.0",
    "sqlalchemy>=2.0.0",
    "aioredis>=2.0.0",
    "tenacity>=8.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
